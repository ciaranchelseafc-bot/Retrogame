<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐱 CAT & MEME CHAOS (NO CAP)</title>
  <style>
    :root {
      --bg1: #ff007f;
      --bg2: #7928ca;
      --bg3: #00f2fe;
    }
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Comic Sans MS', 'Impact', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      background-size: 400% 400%;
      animation: gradientShift 10s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      position: relative;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-3px, 2px, 0) rotate(-1deg); }
      20%, 80% { transform: translate3d(4px, -3px, 0) rotate(2deg); }
      30%, 50%, 70% { transform: translate3d(-6px, 4px, 0) rotate(-2deg); }
      40%, 60% { transform: translate3d(6px, -4px, 0) rotate(1deg); }
    }
    .card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      padding: 32px 40px;
      max-width: 540px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 30px rgba(255, 0, 128, 0.3);
      z-index: 10;
      transition: transform 0.2s ease;
    }
    .card:hover {
      transform: scale(1.02);
    }
    h1 {
      font-size: 2.8rem;
      margin: 0 0 8px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 20px #ff007f;
      letter-spacing: -1px;
    }
    .tagline {
      font-size: 1.2rem;
      margin-bottom: 24px;
      color: #fef08a;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 24px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      padding: 12px;
    }
    .stat-box {
      font-size: 0.95rem;
    }
    .stat-number {
      font-size: 1.8rem;
      font-weight: 900;
      color: #38bdf8;
      display: block;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    button {
      padding: 14px 20px;
      font-size: 1.05rem;
      font-weight: 800;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }
    button:hover {
      transform: translateY(-3px) scale(1.04);
    }
    button:active {
      transform: translateY(2px) scale(0.96);
    }
    .btn-spawn {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
    }
    .btn-chaos {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
    }
    .btn-nuke {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: white;
      grid-column: span 2;
    }
    /* Floating cat entities */
    .cat-entity {
      position: absolute;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      0% { transform: scale(0) rotate(-20deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .cat-icon {
      font-size: 4rem;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
      cursor: grab;
      pointer-events: auto;
      transition: transform 0.2s;
    }
    .cat-icon:hover {
      transform: scale(1.3) rotate(15deg);
    }
    .meme-badge {
      background: #000;
      color: #fff;
      font-weight: 900;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      margin-top: 4px;
      border: 2px solid #facc15;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      text-transform: uppercase;
    }
    /* Floating Sparkles */
    .sparkle {
      position: absolute;
      pointer-events: none;
      font-size: 1.5rem;
      animation: floatUp 1.2s forwards ease-out;
      z-index: 30;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.6); opacity: 1; }
      100% { transform: translateY(-80px) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <h1>😼 HELLO WORLD: CAT EDITION</h1>
    <div class="tagline">🔥 It's giving chaotic energy. No cap. 💯</div>

    <div class="stats">
      <div class="stat-box">
        <span class="stat-number" id="catCount">0</span>
        Cats Spawned
      </div>
      <div class="stat-box">
        <span class="stat-number" id="auraCount">1,000</span>
        Aura Points
      </div>
    </div>

    <div class="btn-grid">
      <button class="btn-spawn" id="spawnBtn">🐱 Spawn a Cat</button>
      <button class="btn-chaos" id="chaosBtn">🌈 Chaos Palette</button>
      <button class="btn-nuke" id="memeRainBtn">⚡ 10X CAT MEME EXPLOSION</button>
    </div>
  </div>

  <script>
    const CAT_ICONS = ['😹', '😻', '🙀', '😼', '😸', '😽', '🐱', '🐅', '🐆'];
    const GENZ_MEMES = [
      'LET HIM COOK 👨‍🍳',
      'NO CAP FR FR 🧢',
      'MAXIMUM RIZZ ✨',
      'BUSSIN 💯',
      'SIDE EYE... CRIMINAL SIDE EYE 👀',
      'DELULU IS THE SOLULU 🌟',
      'SLAY QUEEN 💅',
      'VERY DEMURE, VERY MINDFUL 🌸',
      'CAUGHT IN 4K 📸',
      'MAIN CHARACTER ENERGY 👑',
      'RENT FREE IN MY HEAD 🧠',
      'L + RATIO + YOU FELL OFF 📉',
      'BIG PURR 🐾',
      'SIGMA FELINE 🗿'
    ];

    const PALETTES = [
      ['#ff007f', '#7928ca', '#00f2fe'],
      ['#ff416c', '#8a2387', '#e94057'],
      ['#11998e', '#38ef7d', '#0575e6'],
      ['#fc4a1a', '#f7b733', '#8e2de2'],
      ['#f12711', '#f5af19', '#7f00ff'],
      ['#00c6ff', '#0072ff', '#fe0979']
    ];

    let cats = [];
    let catCount = 0;
    let aura = 1000;
    const catCountEl = document.getElementById('catCount');
    const auraCountEl = document.getElementById('auraCount');
    const mainCard = document.getElementById('mainCard');

    function createCat(x, y) {
      const el = document.createElement('div');
      el.className = 'cat-entity';

      const icon = CAT_ICONS[Math.floor(Math.random() * CAT_ICONS.length)];
      const meme = GENZ_MEMES[Math.floor(Math.random() * GENZ_MEMES.length)];

      el.innerHTML = `
        <div class="cat-icon">${icon}</div>
        <div class="meme-badge">${meme}</div>
      `;

      document.body.appendChild(el);

      const speed = 2 + Math.random() * 4;
      const angle = Math.random() * Math.PI * 2;
      const catObj = {
        el,
        x: x !== undefined ? x : Math.random() * (window.innerWidth - 120),
        y: y !== undefined ? y : Math.random() * (window.innerHeight - 120),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        rot: 0,
        vRot: (Math.random() - 0.5) * 3
      };

      // Interactive click on cat
      el.querySelector('.cat-icon').addEventListener('click', (e) => {
        e.stopPropagation();
        aura += 500;
        auraCountEl.textContent = aura.toLocaleString();
        spawnSparkle(catObj.x, catObj.y, '✨ +500 RIZZ');
        catObj.vx *= 1.5;
        catObj.vy *= 1.5;
      });

      cats.push(catObj);
      catCount++;
      aura += 100;
      catCountEl.textContent = catCount;
      auraCountEl.textContent = aura.toLocaleString();
    }

    function spawnSparkle(x, y, text) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.textContent = text || '✨';
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1200);
    }

    // Physics Animation Loop
    function updatePhysics() {
      const w = window.innerWidth;
      const h = window.innerHeight;

      for (let c of cats) {
        c.x += c.vx;
        c.y += c.vy;
        c.rot += c.vRot;

        if (c.x <= 10 || c.x >= w - 140) {
          c.vx *= -1;
          c.x = Math.max(10, Math.min(c.x, w - 140));
          c.vRot = (Math.random() - 0.5) * 6;
        }
        if (c.y <= 10 || c.y >= h - 140) {
          c.vy *= -1;
          c.y = Math.max(10, Math.min(c.y, h - 140));
          c.vRot = (Math.random() - 0.5) * 6;
        }

        c.el.style.left = c.x + 'px';
        c.el.style.top = c.y + 'px';
        c.el.style.transform = `rotate(${c.rot}deg)`;
      }

      requestAnimationFrame(updatePhysics);
    }
    requestAnimationFrame(updatePhysics);

    // Button Listeners
    document.getElementById('spawnBtn').addEventListener('click', () => {
      createCat();
    });

    document.getElementById('chaosBtn').addEventListener('click', () => {
      const pal = PALETTES[Math.floor(Math.random() * PALETTES.length)];
      document.documentElement.style.setProperty('--bg1', pal[0]);
      document.documentElement.style.setProperty('--bg2', pal[1]);
      document.documentElement.style.setProperty('--bg3', pal[2]);

      document.body.classList.remove('shake');
      void document.body.offsetWidth; // trigger reflow
      document.body.classList.add('shake');

      spawnSparkle(window.innerWidth / 2 - 40, window.innerHeight / 2 - 100, '🌈 VIBE CHECK PASSED');
    });

    document.getElementById('memeRainBtn').addEventListener('click', () => {
      for (let i = 0; i < 10; i++) {
        setTimeout(() => createCat(), i * 60);
      }
      document.body.classList.remove('shake');
      void document.body.offsetWidth;
      document.body.classList.add('shake');
    });

    // Click anywhere to spawn cat & sparkles
    document.body.addEventListener('click', (e) => {
      if (!e.target.closest('button') && !e.target.closest('.cat-icon')) {
        createCat(e.clientX - 50, e.clientY - 50);
        spawnSparkle(e.clientX, e.clientY, '🐾');
      }
    });

    // Spawn 2 initial cats
    createCat(window.innerWidth * 0.2, 100);
    createCat(window.innerWidth * 0.7, 100);
  </script>
</body>
</html>
